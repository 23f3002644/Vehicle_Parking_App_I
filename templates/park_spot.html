<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lots</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel = "stylesheet" href ="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    
    
</head>
<body>
    <div class="login-container">
        <h2>View/Delete Lots</h2>
        <form method="POST"> 
<!--here you have to change the action to any thing or otherwise to delete it -->
            <label for="lot_id">ID</label>
            <input type="text" id="lot_id" name="lot_id" required>
<!-- Here you have to make the change as required as "O" or "A"-->
            <label for="status">Status</label>
            <input type="text" id="status" name="status" required>

            <div class="d-flex gap-2">
                <button type="submit">Delete</button>
                <button type="submit">Close</button>
            </div>    

        </form>
        
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Lots</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel = "stylesheet" href ="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    
    
</head>
<body>
    <div class="login-container">
        <h2>Edit Parking Lot</h2>
        <form method="POST"> 
<!--here you have to change the action to any thing or otherwise to delete it -->
            <label for="location">Prime Location Name</label>
            <input type="text" id="location" name="location" required>

            <label for="address">Address</label>
            <input type="text" id="address" name="address" required>

            <label for="pincode">Pincode</label>
            <input type="number" id="pincode" name="pincode" required>

            <label for="price">Price (per hours)</label>
            <input type="number" id="price" name="price" required>

            <label for="max_spot">Maximum Spots</label>
            <input type="number" id="max_spot" name="max_spot" required>

            

            <div class="d-flex gap-2">
                <button type="submit">Update</button>
                <button type="submit">Cancel</button>
            </div>    

        </form>
        
    </div>
</body>
</html>

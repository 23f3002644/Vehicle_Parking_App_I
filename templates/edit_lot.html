<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Lots</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel = "stylesheet" href ="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    
    
</head>
<body>
    <div class="login-container">
        <h2>Edit Parking Lot</h2>
        <form method="POST" action="/edit_parking_lot/{{this_lot.id}}"> 
<!--here you have to change the action to any thing or otherwise to delete it -->
            <label for="location">Prime Location Name</label>
            <input type="text" id="location" name="location" placeholder="{{this_lot.location}}" required>

            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="{{this_lot.address}}" required>

            <label for="pincode">Pincode</label>
            <input type="number" id="pincode" name="pincode" placeholder="{{this_lot.pincode}}" required>

            <label for="price">Price (per hours)</label>
            <input type="number" id="price" name="price" placeholder="{{this_lot.price}}" required>

            <label for="max_spot">Maximum Spots</label>
            <input type="number" id="max_spot" name="max_spot" placeholder="{{this_lot.available_spots}}" required>

            

            <div class="d-flex gap-2">
                <button type="submit">Update</button>
                <a href ="/admin_dashboard" type="button" class="btn btn-primary">Cancel</a>
            </div>    

        </form>
        
    </div>
</body>
</html>

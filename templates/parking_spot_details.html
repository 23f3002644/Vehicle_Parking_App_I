<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Occupied_Spot_details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel = "stylesheet" href ="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    
</head>
<body>
    <div class="login-container">
        <h2>Occupied Parking Spot Details</h2>
        <form method="POST" action='/occupied_spot_detail/{{spot_id}}'>

            <label for="spot_id">Spot_ID</label>
            <input type="text" id="spot_id" name="spot_id" value="{{this_spot_reserve.spot_id}}" required>

            <label for="vehi_no">Vehicle Number</label>
            <input type="text" id="vehi_no" name="vehi_no" value="{{this_spot_reserve.vehicle_no}}" required>

            <label for="park_time">Parking Time</label>
            <input type="text" id="park_time" name="park_time" value="{{ this_spot_reserve.start_time.strftime('%A, %B %d, %Y %I:%M %p')  }}" required style="width: 295px;">

           <label for="user_id">Customer ID</label>
            <input type="text" id="user_id" name="user_id" value="{{this_spot_reserve.user_id}}" required>

           

            
            <div class=" text-center">
               
                <a href ="/admin_dashboard" type="button" class="btn btn-primary">Close</a>
            </div>

        </form>
        
    </div>
</body>
</html>

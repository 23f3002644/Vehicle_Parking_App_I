<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin_Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body>
    <div id ="main">
        <div id ="canvas"> 

            <nav class="navbar navbar-expand-lg bg-primary">
                <div class="container-fluid">
                    <h4>Welcome {{this_user.fullname}}</h4>   
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">

                        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 list-group list-group-horizontal text-center">
                            <li class="nav-item list-group-item  list-group-item-success">
                                <a class="nav-link active" aria-current="page" href="/admin_dashboard">Home</a>
                            </li>
                            <li class="nav-item list-group-item  list-group-item-success">
                                <a class="nav-link active" aria-current="page" href="/user_details">Users</a>
                            </li> 
                            <li class="nav-item list-group-item  list-group-item-success">
                                <a class="nav-link active" aria-current="page" href="#">Search</a>
                            </li>
                            <li class="nav-item list-group-item  list-group-item-success">
                                <a class="nav-link active" aria-current="page" href="#">Summary</a>
                            </li>  
                            <li class="nav-item list-group-item  list-group-item-success">
                                <a class="nav-link active" aria-current="page" href="/login">Logout</a>
                            </li>
                                
                        </ul>
                        
                        <a class="nav-link active" aria-current="page" href="#">Edit profile</a>

                    </div>
                </div>
            </nav>

            <div class ="top-section">
                <div id ="content">
                        <h3 class="heading">Registered Users</h3>
                        <table class="table table-striped table-bordered">
                            <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Email ID</th>
                                    <th scope="col">Full Name</th>
                                    <th scope="col">Address</th>
                                    <th scope="col">Pincode</th>
                                    
                                </tr>
                            </thead>
                                <tbody>

                                    {% for user in all_users %}
                                    <tr>
                                        <th scope="row">{{user.id}}</th>
                                        <td>{{user.email}}</td>
                                        <td>{{user.fullname}}</td>
                                        <td>{{user.address}}</td>
                                        <td>{{user.pincode}}</td>
                                                                                
                                    </tr>
                                    {% endfor %}
                                    
                                    
                                </tbody>
                        </table>
                </div>
            </div>
            
        </div>
    </div>
    
</body>
</html>

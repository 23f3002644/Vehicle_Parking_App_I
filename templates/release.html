<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Release</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel = "stylesheet" href ="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    
</head>
<body>
    <div class="login-container">
        <h2>Release The Parking Spot</h2>
        <form method="POST" action="/login">
            <label for="spot_id">Spot_ID</label>
            <input type="text" id="spot_id" name="spot_id" required>

            <label for="vehi_no">Vehicle Number</label>
            <input type="text" id="vehi_no" name="vehi_no" required>

            <label for="park_time">Parking Time</label>
            <input type="time" id="park_time" name="park_time" required style="width: 295px;">

            <label for="rls_time">Releasing Time</label>
            <input type="time" id="rls_time" name="rls_time" required style="width: 295px;">

            <label for="t_cost">Total Cost</label>
            <input type="text" id="t_cost" name="t_cost" required>

           

            
            <div class="d-flex gap-2">
                <button type="submit">Release</button>
                <button type="submit">Cancel</button>
            </div>

        </form>
        
    </div>
</body>
</html>

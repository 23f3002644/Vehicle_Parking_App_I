<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Release</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel = "stylesheet" href ="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    
</head>
<body>
    <div class="login-container">
        <h2>Release The Parking Spot</h2>
        <form method="POST" action='/release/{{reserve1.user_id}}/{{reserve1.lot_id}}/{{reserve1.spot_id}}'>

            <label for="location">Location</label>
            <input type="text" id="location" name="location" value="{{this_lot.location}}" required>

            <label for="vehi_no">Vehicle Number</label>
            <input type="text" id="vehi_no" name="vehi_no" value="{{reserve1.vehicle_no}}" required>

            <label for="spot_id">Spot_ID</label>
            <input type="text" id="spot_id" name="spot_id" value="{{reserve1.spot_id}}" required>

            <label for="park_time">Parking Time</label>
            <input type="text" id="park_time" name="park_time" value="{{ reserve1.start_time.strftime('%A, %B %d, %Y %I:%M %p') }}" required style="width: 295px;">

            <div class="d-flex gap-2">
                <button type="submit" >Release</button>
                <a href ="/user_dashboard/{{user_id}}" type="button" class="btn btn-primary">Cancel</a>
            </div>

        </form>
        
    </div>
</body>
</html>

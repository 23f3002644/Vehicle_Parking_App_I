<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View_or_Edit_profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    
</head>
<body>
    <div class="login-container">
        <h2>View / Edit Profile</h2>

        <form method="POST" action="/edit_profile/{{this_user.id}}">

            <label for="email">Username (Email ID)</label>
            <input type="text" id="email" name="email" placeholder="{{this_user.email}}" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="{{this_user.password}}" required>

            <label for = "fullname">Full Name</Label>
            <input type = "text" id = "fullname" name = "fullname" placeholder="{{this_user.fullname}}" required>  
            
            <label for = "address"> Address</label>
            <input type ="text" id = "address" name ="address" placeholder="{{this_user.address}}" required>

            <label for = "pincode"> Pincode </label>
            <input type ="number" id = "pincode" name ="pincode" placeholder="{{this_user.pincode}}" required>

            <div class="d-flex gap-2">
                <button type="submit">Edit</button>
                <a href ="/user_dashboard/{{this_user.id}}" type="button" class="btn btn-primary">Close</a>
            </div>
            

        </form>
        
        
    </div>
</body>
</html>

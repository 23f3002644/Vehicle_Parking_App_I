<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View_or_Delete</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel = "stylesheet" href ="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    
    
</head>
<body>
    <div class="login-container">
        <h2>View/Delete Lots</h2>
        <form method="POST" action="/delete_spot/{{this_spot.id}}"> 

            <label for="lot_id">ID</label>
            <input type="text" id="lot_id" name="lot_id"  value="{{this_spot.id}}" required>

            <label for="status">Status</label>
            <input type="text" id="status" name="status"  value="{{this_spot.status}}" required>
            
            

            <div class="d-flex gap-2">
                {% if this_spot.status == "Occupied" %}
                <a href ="/occupied_spot_detail/{{this_spot.id}}" type="button" class="btn btn-info">View Occupation</a>
                {% else %}
                <button type="submit"  class="btn btn-danger" >Delete</button> 
                
                {% endif %}
                <a href ="/admin_dashboard" type="button" class="btn btn-primary">Close</a>
            </div>    

        </form>
        
    </div>
</body>
</html>

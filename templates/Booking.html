<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parking Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel = "stylesheet" href ="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    
</head>
<body>
    <div class="login-container">
        <h2>Book The Parking Spot</h2>
        <form method="POST" action='/book_spot/{{user_id}}/{{lot_id}}/{{spot_id}}'>

            <label for="location">Location</label>
            <input type="text" id="location" name="location" value="{{this_lot.location}}" required>

            <label for="user_id">User_ID</label>
            <input type="text" id="user_id" name="user_id" value="{{user_id}}" required>

            <label for="lot_id">Lot_ID</label>
            <input type="text" id="lot_id" name="lot_id" value="{{lot_id}}" required>

            <label for="spot_id">Spot_ID</label>
            <input type="text" id="spot_id" name="spot_id" value="{{spot_id}}" required>

            <label for="vehi_no">Vehicle Number</label>
            <input type="text" id="vehi_no" name="vehi_no" required>

            
            <div class="d-flex gap-2">
                <button type="submit">Reserve</button>
                <a href ="/user_dashboard/{{user_id}}" type="button" class="btn btn-primary">Cancel</a>
            </div>

        </form>
        
    </div>
</body>
</html>

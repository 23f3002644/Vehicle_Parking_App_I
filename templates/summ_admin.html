<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin_Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body>
    <div id ="main">
        <div id ="canvas"> 

            <nav class="navbar navbar-expand-lg bg-primary">
                <div class="container-fluid">
                    <h4>Welcome {{this_user.fullname}}</h4>   
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">

                        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 list-group list-group-horizontal text-center">
                            <li class="nav-item list-group-item  list-group-item-success">
                                <a class="nav-link active" aria-current="page" href="/admin_dashboard">Home</a>
                            </li>
                            <li class="nav-item list-group-item  list-group-item-success">
                                <a class="nav-link active" aria-current="page" href="/user_details">Users</a>
                            </li>
                            <li class="nav-item list-group-item  list-group-item-success">
                                <a class="nav-link active" aria-current="page" href="#">Summary</a>
                            </li>   
                            <li class="nav-item list-group-item  list-group-item-success">
                                <a class="nav-link active" aria-current="page" href="/login">Logout</a>
                            </li>
                            </ul>   
                        
                         <form class="d-flex" action="/search">
                            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="search">
                                <select class="form-select me-2" aria-label="Default select example" name="key">
                                    <option selected>select</option>
                                    <option value="user">User</option>
                                    <option value="lot">Parking Lots</option>
                                </select>
                            <input class="btn btn-outline-success" type="submit" value="Search">
                        </form>
                        
                        

                    </div>
                </div>
            </nav>

            <div id ="content">
                    <h3 class="heading">Summary</h3>
                    <div class="container">
                        <div class="d-flex justify-content-around text-center" style="margin-top: 40px;">
                            <div class="card bg-info p-3 ">
                                <h3>Total Users</h3>
                                <h5>{{total_user}}</h5>
                            </div>
                            <div class="card bg-warning p-3 ">
                                <h3>Total Lots</h3>
                                <h5>{{total_lots}}</h5>
                            </div>
                            <div class="card bg-primary p-3 ">
                                <h3>Total Spots</h3>
                                <h5>{{total_spot}}</h5>
                            </div>
                            <div class="card bg-primary p-3 ">
                                <h3>Available Spots</h3>
                                <h5>{{total_available_spots}}</h5>
                            </div>
                        </div> 
                    </div>
                <div class="my-2">
                    <h3 class="mx-2"> Total Spots in each Lots</h3>
                    <img src="/static/bar.png" alt="Pie chart">
                </div>                        
            </div>   
               
        </div>
    </div>
    
</body>
</html>
